syntax = "proto3";
package drug;
option go_package = "drugsync/proto;drugpb";

// ---------- The service: what methods exist ----------
service DrugService {
  // ---- Read ----
  // Unary: ask for one drug, get one drug
  rpc GetDrug(GetDrugRequest) returns (Drug);
  // Server-streaming: ask once, results flow in one by one
  rpc SearchDrugs(SearchRequest) returns (stream Drug);

  // ---- Write ----
  // Add a brand new drug
  rpc CreateDrug(CreateDrugRequest) returns (Drug);
  // Replace every field of an existing drug
  rpc UpdateDrug(UpdateDrugRequest) returns (Drug);
  // Change only the fields that were sent
  rpc PatchDrug(PatchDrugRequest) returns (Drug);
  // Remove a drug
  rpc DeleteDrug(DeleteDrugRequest) returns (DeleteDrugResponse);

  // ---- Admin ----
  // Unary: pull fresh data from openFDA into our database
  rpc SyncFromFDA(SyncRequest) returns (SyncResponse);
}

// ---------- The data shapes ----------
message Drug {
  string id             = 1;
  string brand_name     = 2;
  string generic_name   = 3;
  string manufacturer   = 4;
  string product_ndc    = 5;
  string product_type   = 6;
  string route          = 7;
  string substance_name = 8;
}

message GetDrugRequest {
  string id = 1;
}

message SearchRequest {
  string query = 1;
  int32  limit = 2;
}

message CreateDrugRequest {
  Drug drug = 1;
}

message UpdateDrugRequest {
  string id   = 1;
  Drug   drug = 2;
}

message PatchDrugRequest {
  string id = 1;

  // optional means "the sender may leave this out".
  // A field that was left out is not changed in the database.
  optional string brand_name     = 2;
  optional string generic_name   = 3;
  optional string manufacturer   = 4;
  optional string product_ndc    = 5;
  optional string product_type   = 6;
  optional string route          = 7;
  optional string substance_name = 8;
}

message DeleteDrugRequest {
  string id = 1;
}

message DeleteDrugResponse {
  bool deleted = 1;
}

message SyncRequest {
  int32 count = 1;
}

message SyncResponse {
  int32 fetched = 1;
  int32 saved   = 2;
  int32 skipped = 3;
}